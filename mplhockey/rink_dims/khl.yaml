specifications:
  units: m

rink:
  width: 60.0            # KHL commonly uses 60 m length; many teams use 28 m ("Finnish") width :contentReference[oaicite:2]{index=2}
  height: 28.0           # Finnish standard compromise (between 26 and 30)
  corner_radius: 8.5     # within international corner-radius range :contentReference[oaicite:3]{index=3}
  boards_width: 0.30     # display-only
  ice_color: !scheme ice
  boards_color: !scheme outline

ice_features:
  # --- Goal frame / net at the goal line ---
  - name: net
    geometry: Net
    position: [26.0, 0.0]          # goal line 4 m from end boards => x = 30 - 4 = 26 :contentReference[oaicite:4]{index=4}
    opening_width: 1.83            # international goal opening (m)
    corner_radius: 0.4572
    max_width: 2.2350984
    max_depth: 1.1173968
    color: !scheme net
    mirror: length

  - name: net_outline
    geometry: NetOutline
    position: [26.0, 0.0]
    opening_width: 1.83
    corner_radius: 0.4572
    max_width: 2.2350984
    max_depth: 1.1173968
    linewidth: 0.05
    color: !scheme outline
    mirror: length

  # --- Crease (kept as your NCAA-style geometry, in metres) ---
  - name: crease_paint
    geometry: CreaseNCAA
    position: [26.0, 0.0]
    radius: 1.8288
    color: !scheme crease
    mirror: length

  - name: crease_outline
    geometry: CreaseOutlineNCAA
    position: [26.0, 0.0]
    radius: 1.8288
    linewidth: 0.05
    color: !scheme red
    mirror: length

  # --- Centre ice ---
  - name: center_line
    geometry: VLine
    x_pos: 0.0
    linewidth: 0.30                # international centre line width :contentReference[oaicite:5]{index=5}
    color: !scheme red
    mirror: none

  - name: center_faceoff_location
    geometry: RinkCircle
    position: [0.0, 0.0]
    radius: 0.15                   # 30 cm diameter centre spot
    color: !scheme blue
    mirror: none

  - name: faceoff_circle
    geometry: RinkCircleOutline
    position: [0.0, 0.0]
    radius: 4.50
    linewidth: 0.05
    color: !scheme blue
    mirror: none

  # --- Lines ---
  - name: blue_line
    geometry: VLine
    x_pos: 8.6667                  # goal-line-to-goal-line (52 m) split into thirds => 17.333 m; half => 8.6667 :contentReference[oaicite:6]{index=6}
    linewidth: 0.30                # international blue line width :contentReference[oaicite:7]{index=7}
    color: !scheme blue
    mirror: length

  - name: goal_line
    geometry: VLine
    x_pos: 26.0
    linewidth: 0.05                # international goal line width :contentReference[oaicite:8]{index=8}
    color: !scheme red
    mirror: length

  # --- Neutral-zone faceoff spots ---
  - name: neutral_zone_faceoff_spot
    geometry: FaceoffCircle
    position: [7.1667, 7.0]        # 1.5 m inside blue line (8.6667 - 1.5)
    radius: 0.30
    thickness: 0.05
    inside_width: 0.3557
    color: !scheme red
    mirror: both

  # --- End-zone faceoff spots ---
  - name: offensive_zone_faceoff_spot
    geometry: FaceoffCircle
    position: [20.0, 7.0]          # 6.0 m from goal line: 26 - 6 = 20
    radius: 0.30
    thickness: 0.05
    inside_width: 0.3557
    color: !scheme red
    mirror: both

  - name: offensive_zone_faceoff_circle
    geometry: ProngedFaceoffCircle
    position: [20.0, 7.0]
    radius: 4.50
    linewidth: 0.05
    prong_lengths: 0.6096
    prong_linewidth: 0.05
    dist_between_prongs: 0.9144
    color: !scheme red
    mirror: both

  - name: offensive_zone_faceoff_L_accents
    geometry: FaceoffCircleLAccents
    position: [20.0, 7.0]
    offset: [0.6096, 0.2286]
    lengthwise_length: 1.2192
    widthwise_length: 0.9144
    linewidth: 0.05
    color: !scheme red
    mirror: both

  # --- Goalkeeper restricted area (trapezoid) ---
  - name: trapezoid
    geometry: Trapezoid
    position: [26.0, 0.0]
    near_width: 6.80
    far_width: 8.60
    length: 4.0
    linewidth: 0.05
    color: !scheme red
    mirror: length

  - name: posts
    geometry: Posts
    position: [26.0, 0.0]
    inside_width: 1.83
    tube_radius: 0.025
    color: !scheme outline
    mirror: length

  # --- Officials/referee circle (placed at bottom edge for display) ---
  - name: referee_circle
    geometry: RinkCircleOutline
    position: [0.0, -14.0]         # bottom edge is y = -height/2 = -14.0 on a 28 m wide rink
    radius: 3.0
    linewidth: 0.05
    color: !scheme red
    mirror: none

other_features:
  # Display/arena elements shifted to match 28 m width (half-width = 14.0)
  - name: penalty_box
    geometry: RinkBox
    position: [3.3528, -14.9144]   # was -15.9144 for 30 m; shifted +1.0 m for 28 m
    box_width: 3.048
    box_height: 1.2192
    color: !scheme penalty_box
    mirror: length

  - name: penalty_box_outline
    geometry: RinkBoxOutline
    position: [3.3528, -14.9144]
    box_width: 3.048
    box_height: 1.2192
    linewidth: 0.1524
    color: !scheme outline
    mirror: length

  - name: bench
    geometry: RinkBox
    position: [3.9624, 14.9144]    # was +15.9144 for 30 m; shifted -1.0 m for 28 m
    box_width: 7.3152
    box_height: 1.2192
    color: !scheme bench
    mirror: length

  - name: bench_outline
    geometry: RinkBoxOutline
    position: [3.9624, 14.9144]
    box_width: 7.3152
    box_height: 1.2192
    linewidth: 0.1524
    color: !scheme outline
    mirror: length

  - name: scorekeeper_box
    geometry: RinkBox
    position: [0.0, -14.9144]
    box_width: 3.048
    box_height: 1.2192
    color: !scheme bench
    mirror: none

  - name: scorekeeper_box_outline
    geometry: RinkBoxOutline
    position: [0.0, -14.9144]
    box_width: 3.048
    box_height: 1.2192
    linewidth: 0.1524
    color: !scheme outline
    mirror: none
