specifications:
  units: ft

rink:
  width: 200
  height: 85
  corner_radius: 28
  boards_width: 1
  ice_color: !scheme ice
  boards_color: !scheme outline

ice_features:
  # --- Goals (same) ---
  - name: net
    geometry: Net
    position: [89.0, 0.0]
    opening_width: 6.0
    corner_radius: 1.5
    max_width: 7.333
    max_depth: 3.666
    color: !scheme net
    mirror: length

  - name: net_outline
    geometry: NetOutline
    position: [89.0, 0.0]
    opening_width: 6.0
    corner_radius: 1.5
    max_width: 7.333
    max_depth: 3.666
    linewidth: 0.166
    color: !scheme outline
    mirror: length

  - name: posts
    geometry: Posts
    position: [89.0, 0.0]
    inside_width: 6.0
    tube_radius: 0.0833
    color: !scheme outline
    mirror: length

  # --- Lines (keep) ---
  #- name: center_line
  #  geometry: VLine
  #  x_pos: 0.0
  #  linewidth: 1.0
  #  color: !scheme red
  #  mirror: none

  - name: center_faceoff_bisecting_line
    geometry: VLine
    x_pos: 0.0
    y_pos: 0.0
    linewidth: 0.1667          # 2 inches
    length: 30.0
    color: !scheme blue
    mirror: none

  - name: blue_line
    geometry: VLine
    x_pos: 25
    linewidth: 1.0
    color: !scheme blue
    mirror: length

  # Ringette goal line is typically 2 inches wide; your hockey value was ~2 inches already for outline,
  # but your goal_line was 0.1667 ft = 2 in, so we keep it.
  - name: goal_line
    geometry: VLine
    x_pos: 89
    linewidth: 0.1667
    color: !scheme red
    mirror: length
  
  # --- Free pass circles (ringette) ---
  # Center free pass circle: 30 ft diameter (15 ft radius)
  - name: center_free_pass_circle_bisecting_lines
    geometry: VLine
    x_pos: 69.0
    y_pos: 22.0
    linewidth: 0.1667          # 2 inches
    length: 30.0
    color: !scheme blue
    mirror: both

  # --- Free pass circles (ringette) ---
  # Center free pass circle: 30 ft diameter (15 ft radius)
  - name: center_free_pass_circle
    geometry: RinkCircleOutline
    position: [0.0, 0.0]
    radius: 15.0
    linewidth: 0.1667          # 2 inches
    color: !scheme red
    mirror: none

  # End-zone free pass circles (same locations as hockey end-zone faceoff circles)
  - name: endzone_free_pass_circle
    geometry: RinkCircleOutline
    position: [69.0, 22.0]
    radius: 15.0
    linewidth: 0.1667          # 2 inches
    color: !scheme red
    mirror: both

  # --- Free play lines (ringette lines) ---
  # Overlap the "top" (center-ice side) of the end-zone circles:
  # x = 69 - 15 = 54 (and mirrored to -54)
  - name: free_play_line
    geometry: VLine
    x_pos: 54.0
    linewidth: 0.1667          # 2 inches
    color: !scheme red
    mirror: length

  # --- Free pass dots (two per circle) ---
  # Spec: 1 ft dots (diameter) => radius 0.5 ft, blue.
  # Placement: the official docs describe measurement relative to existing hockey markings;
  # here we use a clean symmetric approximation: +/- 7.5 ft from the bisecting line.
  - name: free_pass_dots_center
    geometry: RinkCircle
    position: [7.5, 0.0]
    radius: 0.5
    color: !scheme blue
    mirror: length
  
  - name: free_pass_dots_endzone
    geometry: RinkCircle
    position: [76.5, 22.0]
    radius: 0.5
    color: !scheme blue
    mirror: both
  
  - name: free_pass_dots_endzone_close
    geometry: RinkCircle
    position: [61.5, 22.0]
    radius: 0.5
    color: !scheme blue
    mirror: both

  # --- Goal crease (ringette) ---
  # Ringette crease is an 8 ft radius semicircle (not hockey-style). This likely needs a new geometry.
  # TEMPORARY PLACEHOLDER: keep a filled hockey crease-ish paint, but with arc_radius=8 and no rectangle feel.
  # Better: implement `CreaseRingette` (filled semicircle) + `CreaseRingetteOutline` (2 in blue line).
  - name: crease_paint
    geometry: CreaseNCAA
    position: [89.0, 0.0]
    radius: 8.0
    color: !scheme crease
    mirror: length

  - name: crease_outline
    geometry: CreaseOutlineNCAA
    position: [89.0, 0.0]
    radius: 8.0
    linewidth: 0.166
    color: !scheme red
    mirror: length

  - name: referee_circle
    geometry: RinkCircleOutline
    position: [10.0, -42.5]
    radius: 10.0
    linewidth: 0.166
    color: !scheme red
    mirror: none

other_features:
  - name : penalty_box
    geometry: RinkBox
    position: [11.0, -45.5]
    box_width: 10.0
    box_height: 4.0
    color: !scheme penalty_box
    mirror: length

  - name : penalty_box_outline
    geometry: RinkBoxOutline
    position: [11.0, -45.5]
    box_width: 10.0
    box_height: 4.0
    linewidth: 0.5
    color: !scheme outline
    mirror: length

  - name : bench
    geometry: RinkBox
    position: [13.0, 45.5]
    box_width: 24.0
    box_height: 4.0
    color: !scheme bench
    mirror: length

  - name : bench_outline
    geometry: RinkBoxOutline
    position: [13.0, 45.5]
    box_width: 24.0
    box_height: 4.0
    linewidth: 0.5
    color: !scheme outline
    mirror: length

  - name : scorekeeper_box
    geometry: RinkBox
    position: [0.0, -45.5]
    box_width: 10.0
    box_height: 4.0
    color: !scheme bench
    mirror: none

  - name : scorekeeper_box_outline
    geometry: RinkBoxOutline
    position: [0.0, -45.5]
    box_width: 10.0
    box_height: 4.0
    linewidth: 0.5
    color: !scheme outline
    mirror: none
